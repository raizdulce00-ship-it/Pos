plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.codemarket.ventas'
    compileSdk 34
    defaultConfig { applicationId 'com.codemarket.ventas'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
    signingConfigs { release { storeFile file('release.keystore'); storePassword 'ventas123'; keyAlias 'ventas'; keyPassword 'ventas123' } }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
